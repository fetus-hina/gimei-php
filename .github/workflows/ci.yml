name: 'CI'

on:
  - 'pull_request'
  - 'push'

env:
  LANG: 'C'

jobs:
  phpSyntaxCheck:
    name: 'PHP Syntax Check (PHP ${{ matrix.env.php }})'

    strategy:
      fail-fast: false
      matrix:
        env:
          - php: '8.2'
            experimental: false

          - php: '8.3'
            experimental: false

          - php: '8.4'
            experimental: false

          - php: '8.5'
            experimental: false

          # 開発版。setup-php では PHP 8.6.0-dev の nightly ビルドが入る
          - php: '8.6'
            experimental: true

    runs-on: 'ubuntu-latest'

    # PHP のセットアップ自体が失敗しうるので、ステップ単位ではなくジョブ単位で許容する
    continue-on-error: ${{ matrix.env.experimental }}

    steps:
      - uses: 'actions/checkout@v7'

      - name: 'Set up PHP ${{ matrix.env.php }}'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.env.php }}'

      - name: 'Syntax check'
        run: |
          # PHP 8.3 以降は `php -l` が複数ファイルを受け付けるので、
          # 1ファイルごとにプロセスを起動しなくて済む。
          # 8.2 以前に複数渡すと先頭のファイルしか検査されず素通りするため、
          # バージョンを見て xargs の渡し方を変える。
          # https://github.com/php/php-src/blob/PHP-8.3/UPGRADING (CLI の項)
          if php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'; then
            xargs_opts=''
          else
            xargs_opts='-n 1'
          fi
          find . \( -type d \( -name '.git' -or -name 'vendor' -or -name 'node_modules' -or -name 'runtime' \) -prune \) -or \( -type f -name '*.php' -print \) \
            | sort \
            | xargs $xargs_opts php -l

  codingStyle:
    name: 'Coding style'

    runs-on: 'ubuntu-latest'

    steps:
      - uses: 'actions/checkout@v7'

      - name: 'Set up PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.2'

      - name: 'Install dependencies'
        run: |
          composer install --prefer-dist

      - name: 'Run PHPCS'
        run: |
          vendor/bin/phpcs --standard=PSR12 --encoding=UTF-8 src test

      - name: 'Run PHPStan'
        run: |
          vendor/bin/phpstan analyze

  test:
    name: 'Test (PHP ${{ matrix.env.php }})'

    strategy:
      fail-fast: false
      matrix:
        env:
          - php: '8.2'
            experimental: false

          - php: '8.3'
            experimental: false

          - php: '8.4'
            experimental: false

          - php: '8.5'
            experimental: false

          # 開発版。setup-php では PHP 8.6.0-dev の nightly ビルドが入る
          - php: '8.6'
            experimental: true

    runs-on: 'ubuntu-latest'

    # PHP のセットアップや composer install 自体が失敗しうるので、
    # ステップ単位ではなくジョブ単位で許容する
    continue-on-error: ${{ matrix.env.experimental }}

    steps:
      - uses: 'actions/checkout@v7'

      - name: 'Set up PHP ${{ matrix.env.php }}'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.env.php }}'
          # データファイルの形式チェック等に assert() を使っているため、
          # 既定の production 設定（zend.assertions=-1）では素通りしてしまう
          ini-values: 'zend.assertions=1'

      - name: 'Install dependencies'
        run: |
          composer install --prefer-dist

      - name: 'Run PHPUnit'
        run: |
          vendor/bin/phpunit
