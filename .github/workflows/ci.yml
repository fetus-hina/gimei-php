name: 'CI'

on:
  - 'pull_request'
  - 'push'

env:
  LANG: 'C'

jobs:
  phpSyntaxCheck:
    name: 'PHP Syntax Check (PHP ${{ matrix.env.php }})'

    strategy:
      fail-fast: false
      matrix:
        env:
          - php: '8.2'
            experimental: false

          - php: '8.3'
            experimental: false

          - php: '8.4'
            experimental: false

          - php: '8.5'
            experimental: false

    runs-on: 'ubuntu-latest'

    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Set up PHP ${{ matrix.env.php }}'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.env.php }}'

      - name: 'Syntax check'
        continue-on-error: '${{ matrix.env.experimental }}'
        run: |
          find . \( -type d \( -name '.git' -or -name 'vendor' -or -name 'node_modules' -or -name 'runtime' \) -prune \) -or \( -type f -name '*.php' -print \) \
            | sort \
            | xargs -n 1 php -l

  codingStyle:
    name: 'Coding style'

    runs-on: 'ubuntu-latest'

    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Set up PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.2'

      - name: 'Install dependencies'
        run: |
          composer install --prefer-dist

      - name: 'Run PHPCS'
        run: |
          vendor/bin/phpcs --standard=PSR12 --encoding=UTF-8 src test

      - name: 'Run PHPStan'
        run: |
          vendor/bin/phpstan analyze

  test:
    name: 'Test (PHP ${{ matrix.env.php }})'

    strategy:
      fail-fast: false
      matrix:
        env:
          - php: '8.2'
            experimental: false

          - php: '8.3'
            experimental: false

          - php: '8.4'
            experimental: false

          - php: '8.5'
            experimental: false

    runs-on: 'ubuntu-latest'

    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Set up PHP ${{ matrix.env.php }}'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.env.php }}'
          # データファイルの形式チェック等に assert() を使っているため、
          # 既定の production 設定（zend.assertions=-1）では素通りしてしまう
          ini-values: 'zend.assertions=1'

      - name: 'Install dependencies'
        run: |
          composer install --prefer-dist

      - name: 'Run PHPUnit'
        continue-on-error: '${{ matrix.env.experimental }}'
        run: |
          vendor/bin/phpunit
